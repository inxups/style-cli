name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOFLAGS: -mod=readonly
      GOPATH: /tmp/style-cli-gopath
      GOMODCACHE: /tmp/style-cli-gomodcache
      GOCACHE: /tmp/style-cli-gocache
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            agenthooks/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi

      # AGENTS.md: CODEX_HOME and CODEX_SANDBOX change harness detection.
      - name: Vet
        run: |
          env -u CODEX_HOME -u CODEX_SANDBOX go vet ./...
          env -u CODEX_HOME -u CODEX_SANDBOX go vet -C agenthooks ./...

      - name: Test
        run: |
          env -u CODEX_HOME -u CODEX_SANDBOX go test ./...
          env -u CODEX_HOME -u CODEX_SANDBOX go test -C agenthooks ./...

      - name: Test acceptance collectors
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s testdata/manual -p 'test_*.py'

      - name: Build
        run: env -u CODEX_HOME -u CODEX_SANDBOX go build -trimpath -o "$RUNNER_TEMP/style" ./cmd/style

      - name: Smoke test built binary
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/smoke.py "$RUNNER_TEMP/style"

      - name: Check replace fallback and user style preservation
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/check_m2_replace.py "$RUNNER_TEMP/style"

  windows:
    name: Test (windows-latest)
    runs-on: windows-latest
    env:
      GOFLAGS: -mod=readonly
      GOWORK: "off"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Isolate caches and external environment
        shell: pwsh
        run: |
          foreach ($key in @('GOPATH','GOMODCACHE','GOCACHE')) {
            "$key=$env:RUNNER_TEMP\style-$key" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          foreach ($item in Get-ChildItem Env:) {
            if ($item.Name -match '^(CODEX_|CLAUDE_|STYLE_|ANTHROPIC_|OPENAI_)') {
              "$($item.Name)=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
      - name: Check formatting
        shell: pwsh
        run: |
          $files = git ls-files '*.go'
          $bad = & gofmt -l $files
          if ($bad) { $bad; exit 1 }
      - name: Vet both modules
        shell: pwsh
        run: |
          go vet ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go vet -C agenthooks ./...
          exit $LASTEXITCODE
      - name: Native Windows fresh tests
        run: python scripts/run_m3_windows.py
      - name: Build native and arm64 binaries
        shell: pwsh
        run: |
          go build -trimpath -o "$env:RUNNER_TEMP\style.exe" ./cmd/style
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go build -trimpath -o "$env:RUNNER_TEMP\harness.exe" ./testdata/windows-helper/main.go
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:GOARCH = 'arm64'
          go build -trimpath -o "$env:RUNNER_TEMP\style-arm64.exe" ./cmd/style
          exit $LASTEXITCODE
      - name: Native Windows CLI smoke
        run: python scripts/check_m3_windows.py "${{ runner.temp }}\style.exe" "${{ runner.temp }}\harness.exe" "${{ runner.temp }}\style-windows-evidence\cli.json"
      - name: Preserve Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: style-windows-evidence
          path: ${{ runner.temp }}/style-windows-evidence
